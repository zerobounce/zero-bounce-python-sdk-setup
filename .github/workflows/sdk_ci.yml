# Run unit tests and coverage on every PR (no API key required for unit tests).
name: SDK CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Lint
        run: |
          pip install ruff==0.17.2
          ruff check src tests
          python -m compileall -q src tests

      - name: Run unit tests with coverage
        run: |
          python -m pytest \
            --cov=zerobouncesdk --cov-report=term-missing --cov-fail-under=50

  # The oldest Python requires-python allows (>=3.10). The tests run against the
  # built wheel, as users install it, from a copy of tests/ outside the source
  # tree, so they import the installed package, not src/.
  test-floor:
    name: Test (Python 3.10, built wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Build the wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Install the wheel and run the unit tests on Python 3.10
        run: |
          python -VV
          python -m pip install --disable-pip-version-check "$(ls dist/*.whl)[test]"
          python -m pip list --disable-pip-version-check
          mkdir "$RUNNER_TEMP/w"
          cp -R tests pyproject.toml "$RUNNER_TEMP/w"
          cd "$RUNNER_TEMP/w"
          python -m compileall -q "$(python -c "import os, zerobouncesdk; print(os.path.dirname(zerobouncesdk.__file__))")"
          python -m pytest -p no:cacheprovider \
            --cov=zerobouncesdk --cov-report=term-missing --cov-fail-under=50
