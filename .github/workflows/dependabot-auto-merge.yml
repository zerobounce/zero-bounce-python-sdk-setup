name: Dependabot security auto-merge

# Dependabot here opens security updates only (.github/dependabot.yml). Patch and minor updates are
# approved and merged once checks pass. A major update gets a comment and is left for a person to
# review and merge, because it can change behaviour even when the tests pass.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 6 * * 2"
      timezone: Europe/Bucharest

permissions:
  contents: write
  pull-requests: write

jobs:
  approve-and-queue-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Read the update type
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve and auto-merge a patch or minor update
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave a major update for review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: >-
          gh pr comment "$PR_URL" --body "Major version update: not auto-merged.
          Review the changelog and merge by hand."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  weekly-merge-ready:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Re-queue Dependabot pull requests already cleared for auto-merge
        # Only PRs the job above approved (patch or minor); majors are never approved by a workflow.
        run: |
          set -euo pipefail
          mapfile -t urls < <(gh pr list --repo "$GITHUB_REPOSITORY" --author app/dependabot --state open \
            --search "review:approved" --json url --jq '.[].url')
          if [ "${#urls[@]}" -eq 0 ]; then
            echo "No approved Dependabot pull requests to queue."
            exit 0
          fi
          for url in "${urls[@]}"; do
            gh pr merge --auto --merge "$url" || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
