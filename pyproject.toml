[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zerobouncesdk"
version = "2.3.0"
description = "ZeroBounce Python API - https://www.zerobounce.net."
readme = "README.md"
authors = [{ name = "ZeroBounce", email = "support@zerobounce.net" }]
license = "MIT"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["zerobounce", "email validation", "email verification", "email finder", "deliverability", "sdk"]
# Floors are the oldest releases without known advisories (OSV) on each Python version.
dependencies = [
    "requests >= 2.33.0; python_version >= '3.10'",
    "requests >= 2.32.4; python_version >= '3.8' and python_version < '3.10'",
    "requests >= 2.31.0; python_version < '3.8'",
    "urllib3 >= 2.8.0; python_version >= '3.10'",
    "idna >= 3.15; python_version >= '3.8'",
    "certifi >= 2026.10.19",
]
requires-python = ">=3.7"

[project.optional-dependencies]
test = [
    "pytest >= 9.0.3; python_version >= '3.10'",
    "pytest >= 7.0.0; python_version < '3.10'",
    "pytest-cov >= 4.0.0",
]

[project.urls]
Homepage = "https://github.com/zerobounce/zero-bounce-python-sdk-setup"
Documentation = "https://www.zerobounce.net/docs/"
Changelog = "https://github.com/zerobounce/zero-bounce-python-sdk-setup/blob/master/CHANGELOG.md"
Issues = "https://github.com/zerobounce/zero-bounce-python-sdk-setup/issues"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "zero_bounce_test_case.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*__main__*", "*/__main__*"]
branch = true

[tool.coverage.report]
fail_under = 50
show_missing = true
exclude_lines = ["pragma: no cover", "def __repr__", "raise AssertionError"]
