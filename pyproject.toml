[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zerobouncesdk"
version = "2.4.0"
description = "ZeroBounce Python API - https://www.zerobounce.net."
readme = "README.md"
authors = [{ name = "ZeroBounce", email = "support@zerobounce.net" }]
license = "MIT"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["zerobounce", "email validation", "email verification", "email finder", "deliverability", "sdk"]
# Floors are the oldest releases without known advisories (OSV).
dependencies = [
    "requests >= 2.33.0",
    "urllib3 >= 2.8.0",
    "idna >= 3.15",
    "certifi >= 2026.10.19",
]
# The fixed requests (2.33.0+) and urllib3 (2.7.0+) releases require Python 3.10.
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "pytest >= 9.0.3",
    "pytest-cov >= 4.0.0",
]

[project.urls]
Homepage = "https://github.com/zerobounce/zero-bounce-python-sdk-setup"
Documentation = "https://www.zerobounce.net/docs/"
Changelog = "https://github.com/zerobounce/zero-bounce-python-sdk-setup/blob/master/CHANGELOG.md"
Issues = "https://github.com/zerobounce/zero-bounce-python-sdk-setup/issues"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "zero_bounce_test_case.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*__main__*", "*/__main__*"]
branch = true

[tool.coverage.report]
fail_under = 50
show_missing = true
exclude_lines = ["pragma: no cover", "def __repr__", "raise AssertionError"]
